name: Add Java backend to VeloRent

on:
  push:
    paths:
      - '.github/scripts/backend-source.zip.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_car_rental_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/smart_car_rental_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      ADMIN_PASSWORD: admin123
    steps:
      - name: Check out VeloRent
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Extract backend package
        run: |
          mkdir -p /tmp/velorent-backend
          base64 --decode .github/scripts/backend-source.zip.b64 > /tmp/velorent-backend.zip
          unzip -q /tmp/velorent-backend.zip -d /tmp/velorent-backend
          cp -R /tmp/velorent-backend/VeloRent_Backend_Patched/backend ./backend
          mkdir -p .github/workflows
          cp /tmp/velorent-backend/VeloRent_Backend_Patched/.github/workflows/backend-ci.yml .github/workflows/backend-ci.yml
          rm .github/scripts/backend-source.zip.b64

      - name: Compile and run real-MySQL integration tests
        run: mvn -B -f backend/pom.xml clean verify

      - name: Document backend setup
        run: |
          cat >> README.md <<'EOF'

          ## Java + JDBC + MySQL backend

          The Java console backend is in `backend/`. It uses Java 21, Maven, JDBC and MySQL 8+.

          ### macOS setup

          Install the tools:

          ```bash
          brew install openjdk@21 maven mysql
          brew services start mysql
          export JAVA_HOME="$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          ```

          Create the application database and tables from the repository root:

          ```bash
          mysql -u root < backend/database/schema.sql
          ```

          Configure the database connection and run the console application:

          ```bash
          export DB_URL="jdbc:mysql://localhost:3306/smart_car_rental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          export DB_USER="root"
          export DB_PASSWORD=""
          export ADMIN_PASSWORD="choose-a-private-admin-password"
          mvn -f backend/pom.xml clean compile
          mvn -f backend/pom.xml exec:java
          ```

          Adjust `DB_PASSWORD` to match the local MySQL account. Do not commit credentials.

          ### Integration tests

          Tests require a separate, disposable database named `smart_car_rental_test`; they modify its records.

          ```bash
          mysql -u root -e "DROP DATABASE IF EXISTS smart_car_rental_test; CREATE DATABASE smart_car_rental_test;"
          export DB_URL="jdbc:mysql://localhost:3306/smart_car_rental_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          export DB_USER="root"
          export DB_PASSWORD=""
          export ADMIN_PASSWORD="admin123"
          mvn -f backend/pom.xml clean verify
          ```

          The GitHub Actions workflow also runs the integration suite against an isolated MySQL service.

          **Integration boundary:** the Java console backend and Next.js website are separate applications. A REST API is still required before the website can use live vehicle data or save website bookings in MySQL.
          EOF

      - name: Commit backend files and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/backend-ci.yml README.md .github/workflows/materialize-backend.yml
          git commit -m "Add Java JDBC MySQL backend and integration tests"
          git push
